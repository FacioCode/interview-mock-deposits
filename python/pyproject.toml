[project]
name = "interview-mock-deposits-python"
version = "0.1.0"
description = "Python port of the Instant Deposits interview exercise."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3-stubs[dynamodb,events]>=1.34",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
